name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x vortex_app/gradlew

      - name: Build Debug APK
        working-directory: vortex_app
        run: ./gradlew assembleDebug

      - name: Decode keystore for Release build
        if: github.event_name == 'push'
        run: |
          mkdir -p vortex_app/secrets
          printf '%s' "${{ secrets.VORTEX_APP }}" | base64 -d > vortex_app/secrets/vortex_app.jks
          echo "Keystore file size: $(wc -c < vortex_app/secrets/vortex_app.jks)"

      - name: Build Release APK
        if: github.event_name == 'push'
        working-directory: vortex_app
        env:
          KEYSTORE_PATH: secrets/vortex_app.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vortex-debug-apk
          path: vortex_app/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: vortex-release-apk
          path: vortex_app/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vortex_app/app/build/outputs/apk/debug/*.apk
            vortex_app/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
